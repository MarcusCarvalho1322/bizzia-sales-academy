{q:"Paciente de retorno de outra clínica com resultado ruim. Abordagem?",o:["Evitar comentar sobre o trabalho anterior.","Perguntar qual foi a cirurgiã anterior.","'Que corajoso da sua parte buscar o resultado que você merece. A Dra. tem experiência em revisões e vai analisar seu caso sem julgamento. Traga documentação do procedimento anterior se tiver.'","Perguntar diretamente o que deu errado."],c:2,k:"rapport",f:"Paciente com procedimento insatisfatório carrega vergonha e medo. Acolha a coragem, posicione a médica como especialista em revisão."},
// c:1
{q:"Qual é o papel central da recepcionista no processo de decisão de uma paciente?",o:["Converter interesse em agendamento de consulta.","Ser a primeira experiência da clínica: criar segurança, qualificar, coletar informações para a médica, e transformar interesse em confiança. A conversão é consequência desse processo.","Vender os procedimentos disponíveis.","Gerenciar agenda e confirmar compromissos."],c:1,k:"rapport",f:"Recepcionista não é telefonista nem vendedora — é gestora da primeira impressão e da confiança."},
// c:3
{q:"Paciente VIP chega sem agendamento pedindo falar com a médica agora. Conduta?",o:["Dizer que sem agendamento não é possível atender.","Verificar se a médica pode atendê-la rapidamente.","Agendar para o próximo horário disponível.","Receber com máxima hospitalidade: 'Que bom recebê-la. A Dra. está em consulta, mas vou verificar o primeiro momento disponível ainda hoje. Posso preparar um café enquanto me conta o que te trouxe?'"],c:3,k:"rapport",f:"Indicação VIP é o gatilho mais poderoso de reputação. O relacionamento pode durar anos — trate a chegada como privilégio."},
// c:0
{q:"Paciente comparece para consulta mas médica atrasou 1 hora. Paciente quer cancelar. Estratégia?",o:["'[Nome], entendo e me desculpe muito. Sei que seu tempo é precioso. A Dra. chega em [X] minutos. Como forma de reconhecer o transtorno, [oferta concreta]. Consegue aguardar?'","Aceitar o cancelamento educadamente.","Explicar o motivo do atraso em detalhes.","Oferecer reagendamento sem custo."],c:0,k:"rapport",f:"Ação imediata + reconhecimento + oferta concreta de valor mantém a paciente. Explicações sem ação concreta irritam mais."},
// c:2
{q:"Paciente pergunta sobre procedimento que a clínica não realiza. Resposta correta?",o:["Dizer que não fazem e encerrar a conversa.","Sugerir uma clínica concorrente que realize.","'No momento não oferecemos esse procedimento. Mas posso perguntar — o que está buscando com ele? Às vezes temos alternativas que chegam ao mesmo resultado.'","Dizer que esse procedimento não é recomendado."],c:2,k:"presentation",f:"'Não temos' pode ser 'mas temos algo equivalente'. Explore a necessidade antes de fechar com uma negativa."},
// c:1
{q:"Como apresentar uma clínica pequena para paciente acostumada a grandes hospitais?",o:["Focar no número de cirurgias realizadas e prêmios.","Posicionar pelo que grandes estruturas não entregam: atenção exclusiva, a mesma cirurgiã do início ao fim, ambiente íntimo, acompanhamento personalizado. Premium não é tamanho — é qualidade de atenção.","Comparar indiretamente os custos.","Mostrar before/after de casos impressionantes."],c:1,k:"presentation",f:"Pequeno é diferencial quando enquadrado como vantagem. Intimidade, exclusividade, atenção contínua — esses são valores que grandes estruturas não conseguem entregar."},
// c:3
{q:"Paciente está gravando o atendimento no celular sem avisar. Como agir?",o:["Pedir que pare de gravar imediatamente.","Interromper o atendimento até guardar o celular.","Ignorar e continuar normalmente.","Com calma: '[Nome], fique à vontade para registrar. Só peço que imagens com identificação de outras pessoas não sejam compartilhadas publicamente — é para proteger a privacidade de todos.'"],c:3,k:"ethics",f:"Confronto cria conflito desnecessário. Transparência desativa defensividade. Pedido de privacidade dos outros é legítimo e posiciona a clínica como cuidadora da coletividade."},
// c:0
{q:"Linguagem corporal ideal da recepcionista ao receber uma paciente?",o:["Postura aberta e receptiva: contato visual genuíno, leve inclinação em direção à paciente, sorriso natural, sem cruzar os braços, sem olhar para a tela enquanto ela fala.","Profissional e distante, para manter limites.","Animada e extrovertida para criar energia positiva.","Discreta e eficiente, sem excesso de expressão."],c:0,k:"rapport",f:"Linguagem corporal comunica mais que palavras. Em ambiente estético, postura aberta e presença genuína são ferramentas de acolhimento poderosas."},
// c:2
{q:"Paciente pergunta se pode amamentar após mamoplastia. Resposta correta?",o:["Dizer que sim, as próteses não impedem amamentação.","Dizer que geralmente é possível, depende da técnica.","'Essa é uma pergunta importante que a Dra. vai avaliar com cuidado — depende de técnica, posicionamento e anatomia. Você planeja engravidar em breve?'","Recomendar que ela pesquise antes de decidir."],c:2,k:"ethics",f:"Questão clínica com implicações de saúde relevantes pertence exclusivamente à médica. Mas colete o contexto — é informação preciosa para a consulta."},
// c:1
{q:"Paciente que fechou R$15k pede para incluir mais um procedimento de R$3k 'aproveitando'. Momento ideal para cross-sell?",o:["Imediatamente, antes que ela mude de ideia.","Na consulta médica, quando a Dra. avalia o que faz sentido clinicamente. A recepcionista pode plantar: 'Muitas pacientes que fazem X avaliam Y também com a Dra.'","Após o pagamento confirmado.","Durante o pré-operatório."],c:1,k:"upsell",f:"Cross-sell por recepcionista sem avaliação clínica pode comprometer segurança. Plante a sugestão e passe para a médica executar."},
// c:3
{q:"Paciente pede para não constar no sistema por 'questões pessoais'. Como manejar?",o:["Aceitar e não registrar no prontuário.","Criar um registro com nome fictício.","Consultar a médica sobre como proceder.","Explicar que prontuário é obrigação legal para segurança dela: 'É protegido por sigilo médico — só a equipe clínica tem acesso. Posso te mostrar nossa política de privacidade?'"],c:3,k:"ethics",f:"Prontuário sem identificação é ilegal. Transparência sobre privacidade resolve o medo real sem comprometer a legalidade."},
// c:0
{q:"Paciente de 28a quer 4 procedimentos simultâneos por 'economia de anestesia'. Médica limitaria a 2. Como manejar?",o:["'Entendo a lógica — é uma boa pergunta para a Dra. Ela vai avaliar o que é seguro para o SEU caso. O que mais incomoda você atualmente para começar por aí?'","Confirmar os 4 procedimentos e deixar a médica decidir.","Dizer que muitos procedimentos juntos têm risco aumentado.","Agendar apenas 2 procedimentos."],c:0,k:"ethics",f:"Nunca faça o trabalho da médica. Use a pergunta para descobrir a prioridade de queixa — informação valiosa para o planejamento."},
// c:2
{q:"Como usar o aniversário de uma paciente VIP como ferramenta de relacionamento?",o:["Enviar mensagem automática de parabéns.","Ligar pessoalmente no dia.","Mensagem personalizada com referência específica ao que ela compartilhou: 'Lembro que você falou que ia comemorar em [lugar]. Esperamos que seja incrível!' — específico, humano, impossível de ser automático.","Enviar gift card de procedimento como presente."],c:2,k:"ltv",f:"Aniversário genérico é ruído. Com detalhe específico que demonstra que você escutou, é experiência memorável."},
// c:1
{q:"Paciente pede que você 'fale mal' de outra clínica onde teve experiência ruim. Como responder?",o:["Concordar que aquela clínica tem problemas conhecidos.","'Lamento muito pela sua experiência. O que posso dizer é o que fazemos AQUI para garantir que você tenha uma jornada completamente diferente — e isso começa já no primeiro contato.'","Dizer que não pode comentar sobre outros estabelecimentos.","Escuta a queixa e faz comentários solidários."],c:1,k:"ethics",f:"Crítica a concorrente por empatia destrói credibilidade. Redirecione para o que a SUA clínica oferece de diferente."},
// c:3
{q:"Qual é a função principal do rapport em vendas de estética?",o:["Fazer a paciente se sentir bem para não reclamar depois.","Economizar tempo de atendimento da médica.","Identificar se a paciente pode pagar pelo procedimento.","Criar base de confiança que reduz objeções, aumenta conversão, eleva tolerância ao preço e gera indicações. O rapport é o ativo mais valioso em vendas de alto valor emocional."],c:3,k:"rapport",f:"Rapport não é 'simpatia' — é investimento estratégico. Em estética, quem constrói confiança vende mais e melhor."},
// c:0
{q:"Paciente mulher de 35a quer cirurgia pré-casamento em 4 meses. Médica consideraria apertado. Como manejar?",o:["'Vamos garantir que você aproveite esse período. Quando é o casamento? Assim já entro com essa data para a Dra. planejar.' — colete o dado, não feche a questão.","Agendar normalmente, a médica decidirá na consulta.","Dizer que 4 meses pode ser apertado.","Perguntar quais procedimentos ela quer fazer."],c:0,k:"discovery",f:"Não assuste antes da consulta. Colete o dado que permite à médica fazer o planejamento correto — seu papel é abrir a consulta com contexto rico."},
// c:2
{q:"Paciente pede para conversar com paciente que já fez o procedimento. Como manejar?",o:["Conectar com paciente que autorizou depoimento.","Dizer que privacidade impede o contato.","'Não posso compartilhar dados de pacientes (privacidade médica), mas posso mostrar depoimentos videografados com autorização e a Dra. pode falar sobre experiências similares na consulta.'","Criar grupo de pacientes satisfeitas para contato."],c:2,k:"ethics",f:"Compartilhar dados de pacientes viola LGPD e ética médica. Depoimentos autorizados e a própria médica são alternativas legais e igualmente efetivas."},
// c:1
{q:"Qual dos seguintes sinais indica que a paciente está pronta para fechar?",o:["Quando ela pedir a conta ou orçamento.","Quando ela começa a planejar 'depois da cirurgia' (viagens, eventos), pede detalhes de recuperação, ou usa primeira pessoa sobre o resultado ('quando eu estiver recuperada...'). Facilite o próximo passo.","Quando ela para de fazer objeções.","Quando ela retorna para segunda consulta."],c:1,k:"closing",f:"Sinais de compra são linguagem do corpo e do discurso — não declaração formal. Quem os reconhece facilita o fechamento naturalmente."},
// c:3
{q:"Paciente de atendimento por WhatsApp manda mensagem às 23h. Quando e como responder?",o:["Responder imediatamente, mesmo tarde, para não perder a lead.","Responder no dia seguinte com uma resposta padrão.","Configurar resposta automática e responder no próximo dia útil com mensagem genérica.","Configurar resposta automática acolhedora à noite e retornar no início do expediente com mensagem personalizada referenciando o que ela enviou."],c:3,k:"rapport",f:"Disponibilidade 24/7 não é padrão premium — é ausência de limite. Resposta personalizada no expediente, com referência à mensagem noturna, demonstra cuidado e profissionalismo."},
// c:0
{q:"Paciente com consulta marcada cancela no dia anterior. Qual a resposta ideal?",o:["'Tudo bem, [Nome]. Fica à vontade. Quando quiser reagendar, estarei aqui. Posso perguntar se há algo que posso esclarecer antes — às vezes uma dúvida que ficou pode ser resolvida rapidamente?'","'Ok, vou cancelar. Ligue quando quiser.'","'Tudo bem. Mas saiba que teremos dificuldade de encaixar em breve.'","'Entendemos. Aguardamos seu contato.'" ],c:0,k:"closing",f:"Cancelamento de véspera frequentemente mascara dúvida ou medo. A pergunta gentil sobre o motivo pode reabrir a conversa e salvar o agendamento."},
// c:2
{q:"Paciente pergunta qual médico é melhor, Dr. A ou Dr. B da clínica. Como responder?",o:["'O Dr. A tem mais experiência em rinoplastia.'","'Isso depende do procedimento que você quer.'","'Ambos são excelentes. O ideal é você sentir com qual se conecta melhor — a confiança na relação médico-paciente é fundamental para o resultado.'","'Não posso comparar nossos médicos entre si.'"],c:2,k:"ethics",f:"Nunca hierarquize profissionais da equipe. Posicione a decisão como escolha de conexão e confiança, não de ranking."},
],

// ━━━━━━━━━━━━━━━━━━━ NÍVEL 2 — HIGH TICKET (50 q) ━━━━━━━━━━━━━━━━━━━━
2:[
// c:2
{q:"CEO, 42a, só tem 20min. Abertura ideal?",o:["Resumir os procedimentos rapidamente.","Pedir que volte quando tiver mais tempo.","'Cristiane, vou respeitar seu tempo. Em 15 minutos entendo o que você busca e deixo estruturado para a Dra. O que mais incomoda você hoje?'","Enviar material por e-mail para ela ler no próprio ritmo."],c:2,k:"rapport",f:"CEO valoriza quem respeita tempo e entrega eficiência sem perder qualidade. Adapte o ritual ao perfil."},
// c:0
{q:"Paciente com R$18k hesita e diz 'é muito dinheiro'. Como responder?",o:["'[Nome], me conta: o que pesa mais — o valor em si, ou ainda ter dúvidas sobre o resultado? Essas são conversas bem diferentes.'","Oferecer parcelamento em 18x imediatamente.","Apresentar opções mais baratas disponíveis.","Explicar o que justifica cada centavo."],c:0,k:"price",f:"'É muito dinheiro' tem dois significados: não tenho o dinheiro OU não vi valor suficiente. Diagnostique antes de responder."},
// c:3
{q:"Advogada, 38a, quer resultado 'discreto que ninguém perceba'. O que isso implica?",o:["Recomendar procedimentos menos invasivos.","Recomendar que ela não conte para ninguém.","Confirmar que os resultados serão naturais.","Sigilo operacional: nome não anunciado em sala de espera, horários com menor movimento, equipe avisada, prontuário com acesso restrito."],c:3,k:"ethics",f:"Profissionais de alta exposição têm necessidade real de discrição operacional. Gestão de privacidade é parte do serviço premium."},
// c:1
{q:"Paciente compara sua clínica com hospital universitário 40% mais barato. Resposta?",o:["Explicar que hospital universitário tem qualidade inferior.","'O que diferencia é a experiência completa: atenção exclusiva, sem residentes, a mesma cirurgiã do início ao fim, acompanhamento direto. Para quem busca exclusividade e atenção continuada, a experiência também importa. O que é mais importante para você?'","Dizer que hospital universitário tem fila de espera.","Não comparar — são serviços diferentes."],c:1,k:"price",f:"Nunca desqualifique alternativa pública. Diferencie pela experiência e exclusividade, e pergunte o que a paciente valoriza."},
// c:2
{q:"Paciente some após 3 consultas sem fechar. Estratégia de reengajamento?",o:["Ligar para oferecer desconto especial.","Aguardar ela entrar em contato quando estiver pronta.","'[Nome], a Dra. acabou de trazer técnicas novas de um congresso que se aplicam ao que conversamos. Teria interesse em uma conversa rápida de atualização?' — cria nova razão de contato.","Enviar mensagem perguntando se ainda tem interesse."],c:2,k:"followup",f:"Reengajamento efetivo cria NOVO motivo de contato. 'Novidade relevante' é melhor do que 'ainda está pensando?'."},
// c:0
{q:"Paciente de alto ticket diz 'vai pesquisar mais'. Resposta estratégica?",o:["'Ótimo que você vai pesquisar. Posso sugerir o que olhar para comparar com consistência? Há critérios técnicos que fazem diferença real e que não aparecem em nenhum site. Posso te passar um guia rápido?'","'Claro, fique à vontade para pesquisar.'","Perguntar o que ainda falta para ela decidir.","Oferecer uma segunda consulta gratuita para tirar dúvidas."],c:0,k:"closing",f:"Quem vai pesquisar vai cair no concorrente. Posicione-se como curador do processo de pesquisa — controle a narrativa da avaliação."},
// c:3
{q:"Paciente de alto valor quer falar com paciente que já fez o procedimento. Como manejar?",o:["Conectar com paciente que autorizou depoimento.","Dizer que privacidade impede esse contato.","Criar grupo de pacientes satisfeitas para contato.","'Não posso compartilhar dados de pacientes (LGPD). Mas posso mostrar depoimentos com autorização e a Dra. pode falar sobre casos similares ao seu na consulta.'"],c:3,k:"ethics",f:"LGPD e ética médica exigem consentimento explícito. Depoimentos autorizados são alternativa legal e igualmente efetiva."},
// c:1
{q:"Paciente de 48a quer rejuvenescimento mas marido é contra. Conduta?",o:["Pedir que ela convença o marido antes de agendar.","'[Nome], a decisão sobre seu próprio corpo é inteiramente sua. Aqui focamos no que você quer e no que a Dra. avalia ser adequado. Se quiser incluir seu marido numa conversa, a Dra. está disponível — mas não é necessário.'","Oferecer consulta de casal para alinhar.","Verificar se o marido tem objeções clínicas válidas."],c:1,k:"ethics",f:"Autonomia corporal da mulher é inegociável. Jamais condicione a consulta à aprovação do parceiro."},
// c:2
{q:"Paciente high ticket pergunta: 'Quantas cirurgias a Dra. faz por dia?' Por que ela pergunta isso?",o:["Ela quer saber o número exato.","Ela quer comparar com outras clínicas.","Está avaliando atenção e exclusividade. Resposta: 'A Dra. limita sua agenda para nunca estar apressada. É exatamente esse critério que entrega o resultado que você quer.'","Está preocupada com o nível de experiência da médica."],c:2,k:"presentation",f:"'Quantas cirurgias por dia' é pergunta de valor, não de logística. Responda revelando o que o comportamento da médica significa para ela."},
// c:0
{q:"Qual é o timing correto para introduzir preço de procedimento high ticket?",o:["Após criar rapport, entender motivação e apresentar o procedimento com valor clínico — o preço vem depois que a paciente entende o que está comprando e por quê vale.","Logo no início para filtrar quem pode pagar.","Quando a paciente perguntar diretamente.","Na confirmação do agendamento, para evitar no-show."],c:0,k:"price",f:"Preço antes do valor percebido sempre parece caro. Preço depois do valor construído parece justo ou até barato."},
// c:3
{q:"Como apresentar resultado que a médica não pode garantir, sem perder a venda?",o:["Mostrar before/afters de casos similares como referência.","Dar uma previsão baseada em casos similares.","Explicar que resultados variam biologicamente.","'A Dra. vai te mostrar na consulta o que é tecnicamente possível para o SEU caso — não promessa genérica. Ela prefere ser honesta sobre o potencial real. É esse cuidado que faz o resultado final superar a expectativa.'"],c:3,k:"objection",f:"Previsão de resultado é armadilha ética. 'Projeção realista baseada no SEU caso' é proposta de valor da consulta."},
// c:1
{q:"Como conduzir contato pós-consulta quando paciente não retornou em 15 dias?",o:["Ligar perguntando se ela já decidiu.","'[Nome], a Dra. deixou uma observação sobre seu caso que quero compartilhar — ela mencionou uma técnica que se aplica perfeitamente ao que vocês conversaram. Seria rápido. Quando tem um momento?'","Enviar mensagem com desconto por tempo limitado.","Aguardar mais 15 dias."],c:1,k:"followup",f:"Follow-up efetivo traz NOVO valor — não reforça a decisão em aberto. 'A médica pensou no seu caso' cria exclusividade."},
// c:2
{q:"Influenciadora com 2M seguidores quer procedimento em troca de divulgação. Médica não quer. Como comunicar?",o:["Dizer que a clínica não faz parcerias comerciais.","Dizer que a Dra. não aceita esse tipo de proposta.","'Sobre a parceria, precisamos alinhar com a direção — retorno em 48h. Enquanto isso, se quiser agendar uma consulta de avaliação para conhecer nosso trabalho, ficamos felizes.'","Registrar a proposta e encaminhar para a médica decidir."],c:2,k:"ethics",f:"Recusa de acordo comercial exige elegância — a influenciadora pode ser paciente pagante futura. Preservar o relacionamento enquanto ganha tempo é mais estratégico."},
// c:0
{q:"Mulher de 35a quer cirurgia pré-casamento em 4 meses. Médica consideraria o prazo apertado. Abordagem?",o:["'Ótimo! Quando é o casamento? Assim a Dra. já planeja o timing de recuperação para que você esteja radiante no grande dia.'","Agendar normalmente, a médica decidirá na consulta.","Dizer que 4 meses pode ser apertado dependendo do procedimento.","Perguntar quais procedimentos ela quer fazer."],c:0,k:"discovery",f:"Colete a data exata — ela informa o planejamento cirúrgico e demonstra que a clínica se importa com a vida real da paciente."},
// c:3
{q:"Paciente insiste em saber o resultado exato. Resposta honesta e que não perde a venda?",o:["Mostrar before/afters de casos similares.","Dar previsão de resultado.","Explicar que resultados variam biologicamente.","'A Dra. vai te mostrar na consulta, com projeção clínica, o que é possível para o SEU rosto — não promessa genérica. Ela é honesta sobre o potencial real, e é isso que faz o resultado final superar a expectativa.'"],c:3,k:"objection",f:"Previsão de resultado é armadilha ética. A consulta como espaço de planejamento honesto é a proposta de valor certa."},
// c:1
{q:"Qual das seguintes é a técnica mais eficaz para apresentar preço de procedimento high ticket?",o:["Apresentar o total e já dividir pelo número de parcelas.","Construir valor primeiro (o que está incluído, cuidado, expertise, resultados), depois apresentar o investimento total, e então as opções de facilitação. Nessa ordem.","Comparar com quanto a paciente gasta com outros serviços ao ano.","Mostrar que parcelado 'cabe no orçamento' mensal."],c:1,k:"price",f:"Ancoragem de valor antes do preço é técnica comprovada. O preço ao final de narrativa bem construída é percebido em relação ao valor apresentado."},
// c:2
{q:"Paciente de 28a quer 4 procedimentos juntos por 'economia de anestesia'. Médica limitaria a 2. Manejar?",o:["Confirmar os 4 procedimentos e deixar a médica decidir.","Dizer que muitos procedimentos juntos têm risco aumentado.","'Entendo a lógica. A Dra. vai avaliar o que é seguro no SEU caso. O que mais incomoda você hoje para começar por aí?'","Agendar apenas 2 procedimentos."],c:2,k:"ethics",f:"Nunca faça o trabalho da médica antes da consulta. Use a pergunta para descobrir prioridade de queixa."},
// c:0
{q:"Paciente de retorno de outro médico com resultado ruim. Abordagem?",o:["'Sinto muito que você passou por isso. O que podemos oferecer é uma avaliação honesta da Dra. sobre o que é possível agora. Traga documentação do procedimento anterior se tiver.'","Perguntar o que deu errado na primeira vez.","Evitar comentar sobre o trabalho anterior.","Perguntar qual foi a cirurgiã anterior."],c:0,k:"rapport",f:"Paciente com procedimento anterior insatisfatório carrega vergonha e medo. Acolha a coragem, posicione a médica como especialista em revisão."},
// c:3
{q:"Paciente VIP pede tratamento especial 'que não dá para todas as pacientes'. Como responder?",o:["Dizer que todas as pacientes recebem o mesmo tratamento de qualidade.","Verificar o que é possível oferecer antes de prometer.","Confirmar que pacientes especiais têm prioridade de agenda.","'Aqui cada paciente recebe atenção personalizada ao seu caso. O que você precisa especificamente? Assim posso garantir que tudo esteja preparado da forma certa.'"],c:3,k:"rapport",f:"Paciente VIP quer sentir que é especial. Pergunte o que ela precisa especificamente em vez de prometer ou negar genericamente."},
// c:1
{q:"Após 3 consultas sem fechar, paciente some. Qual é o intervalo ideal antes de reativar?",o:["1 semana, para não esquecer a consulta.","30 dias é o momento estratégico: tempo suficiente para ela ter amadurecido a decisão, mas não tão longo que a conexão esfrie. Reative com nova razão de contato — não com pergunta sobre a decisão.","3 meses, para dar tempo suficiente.","2 semanas, logo após perceber a ausência."],c:1,k:"followup",f:"30 dias permite amadurecimento da decisão. A nova razão de contato (novidade, atualização da médica) reativa sem pressão."},
// c:2
{q:"Qual é o maior erro ao apresentar diferenciais de clínica para paciente high ticket?",o:["Falar de prêmios e certificações.","Falar do número de anos de experiência da médica.","Comparar explicitamente com o concorrente ou declarar 'somos os melhores'. Cliente high ticket percebe como insegurança ou pressão de venda.","Mostrar before/afters de casos similares."],c:2,k:"presentation",f:"Declarar superioridade gera ceticismo. Demonstrar o que se faz diferente — e deixar a paciente concluir — é muito mais poderoso."},
// c:0
{q:"Como apresentar tecnologia de projeção de resultados (morphing) para paciente cética?",o:["'A Dra. usa projeção clínica baseada na sua anatomia real — não filtro de Instagram. Permite que vocês visualizem juntas o que é possível para o SEU rosto antes de qualquer decisão. Já usou algo assim?'","Mostrar before/afters de cases reais primeiro.","Explicar que é ferramenta de referência, não garantia.","Mostrar o aplicativo na recepção antes da consulta."],c:0,k:"presentation",f:"Cética precisa de contexto, não de entusiasmo. 'Visualizarem juntas' cria colaboração, não promessa."},
// c:3
{q:"Paciente executiva pergunta 'quanto tempo vou ficar parada?' Resposta estratégica?",o:["Dar o tempo médio de recuperação.","Dizer que varia de pessoa para pessoa.","Recomendar tirar duas semanas de licença.","'A Dra. vai responder com precisão para o SEU caso na consulta. O que posso adiantar é que ela estrutura o pós-operatório para a volta mais rápida possível. Você tem uma data específica que precisa estar a pleno vapor?'"],c:3,k:"discovery",f:"'Quanto tempo parada' revela compromissos importantes. Colete a data crítica — ela informa o planejamento e demonstra que a clínica se importa com a vida real da paciente."},
// c:1
{q:"Paciente que fez procedimento há 6 meses não retornou ao pós-operatório. Como conduzir o recontato?",o:["Enviar lembrete de que o pós-operatório está atrasado.","'[Nome], a Dra. estava pensando em você — já faz um tempo do seu procedimento e ela adoraria saber como você está. Quando consegue um horário para um check-in?'","Ligar informando que o não comparecimento vai ao prontuário.","Aguardar ela retornar no próprio tempo."],c:1,k:"followup",f:"Recontato de pós-operatório deve soar como cuidado genuíno. 'A Dra. estava pensando em você' cria vínculo emocional e senso de atenção continuada."},
// c:2
{q:"Qual a diferença entre clínica comum e clínica premium no papel da recepcionista?",o:["A recepcionista premium é mais bem vestida e fala melhor.","A clínica premium tem protocolo mais rígido que ela segue.","Na clínica premium, a recepcionista é gestora de experiência: personaliza cada contato, antecipa necessidades, cria memória afetiva, e trata informações com precisão. Na comum, ela gerencia agenda e informa preços.","A recepcionista premium recebe salário maior."],c:2,k:"rapport",f:"Excelência operacional é o mínimo. O diferencial premium está na qualidade da atenção humana: memória, personalização, antecipação."},
// c:0
{q:"Paciente high ticket diz que vai 'só fazer a consulta, não está decidida'. Abordagem?",o:["'Perfeito — a consulta é exatamente para isso. Sem compromisso, apenas para você ter clareza e a Dra. entender seu caso. O que te levou a querer essa conversa agora?'","Esclarecer que a consulta tem um custo.","Mencionar que muitas que 'só vêm consultar' acabam operando.","Dizer que a consulta inclui avaliação cirúrgica completa."],c:0,k:"closing",f:"'Só vou consultar' deve ser celebrado e respeitado. Quem não pressiona no momento errado cria a condição para a decisão correta — e quando acontece, é sólida."},
// c:3
{q:"Paciente VIP que indicou 6 pessoas nunca recebeu reconhecimento. Como corrigir?",o:["Oferecer desconto retroativo nos próximos procedimentos.","Enviar presente sem explicação.","Mencionar na próxima consulta o quanto ela indica.","'Nos damos conta de que você apresentou 6 pessoas à nossa clínica e nunca expressamos adequadamente nossa gratidão. A Dra. e eu queríamos fazer isso diretamente: muito obrigada. Você é parte do que faz esta clínica ser o que é.'"],c:3,k:"referral",f:"Reconhecimento atrasado ainda tem valor quando genuíno e direto. Transacionalizar com desconto retira o significado."},
// c:1
{q:"Como identificar paciente pronta para fechar sem declaração explícita?",o:["Quando ela pedir a conta.","Quando ela começa a planejar 'depois da cirurgia', pede detalhes de recuperação, pergunta sobre data específica, ou usa primeira pessoa sobre o resultado ('quando eu estiver...').","Quando ela para de fazer objeções.","Quando ela retorna para segunda consulta."],c:1,k:"closing",f:"Sinais de compra são linguagem e comportamento — não declaração formal. Reconhecê-los permite facilitar o fechamento naturalmente, sem forçar nem perder o momento."},
// c:2
{q:"Paciente de alto valor pede exclusividade de agenda (nenhuma outra paciente no mesmo horário). Resposta?",o:["Dizer que é impossível operacionalmente.","Dizer que há horários mais tranquilos disponíveis.","'Valorizamos sua privacidade e conforto. Temos horários com muito menor movimento que posso priorizar. Quer que eu verifique os mais exclusivos da semana?' — e avaliar com a gestão se exclusividade total tem custo diferenciado.","Confirmar a exclusividade sem verificar viabilidade."],c:2,k:"rapport",f:"Pedido impossível tem resposta possível: máxima proximidade da demanda. Exclusividade total pode ter custo que alguns clientes premium pagam com prazer."},
// c:0
{q:"Paciente de alto ticket menciona ir à Colômbia por 60% menos. Como responder?",o:["'Entendo a lógica financeira. Posso compartilhar o que pacientes que passaram por isso nos contam quando retornam? Não é para te dissuadir, mas para uma comparação consciente do que está incluído — principalmente o suporte pós-operatório.'","Explicar os riscos do turismo médico com alarmismo.","Mostrar custos ocultos.","Dizer que qualidade no Brasil é superior."],c:0,k:"price",f:"Alarmismo soa como interesse próprio. Compartilhar relatos reais de pacientes que retornaram com complicações — sem inventar — deixa a paciente calcular o risco por conta própria."},
// c:3
{q:"Como apresentar o plano pós-operatório de forma que eleve o valor percebido?",o:["Detalhar o protocolo de medicações e curativos.","Listar os procedimentos de follow-up incluídos.","Mencionar que a recuperação é acompanhada pela enfermagem.","'O pós-operatório aqui é tão estruturado quanto o procedimento — a Dra. acompanha pessoalmente, temos protocolo específico para maximizar seu resultado. É o que faz a diferença entre resultado bom e excepcional.'"],c:3,k:"presentation",f:"Pós-operatório como diferencial de resultado — não lista de procedimentos — é enquadramento premium. O cliente compra o resultado final, e o pós-op é parte central."},
// c:1
{q:"Paciente pergunta: 'Vocês usam anestesia geral ou local?' e você não sabe. O que fazer?",o:["Responder que depende do procedimento.","'Essa é uma pergunta importante — depende do procedimento específico e do histórico de saúde de cada paciente. A Dra. e a anestesista vão abordar isso na consulta. Posso anotar essa dúvida específica para ela?'","Dizer que usam anestesia geral para tudo.","Pedir para a paciente ligar depois."],c:1,k:"ethics",f:"Dúvidas técnicas pertencem à médica. Mas não deixe a paciente sem respaldo — confirme que a dúvida será respondida e que existe expertise para isso."},
// c:2
{q:"Paciente alta ticket fecha mas pede para não constar no sistema por questões pessoais. Como manejar?",o:["Aceitar e não registrar no prontuário.","Criar um registro com nome fictício.","'Seu prontuário é protegido por sigilo médico — só a equipe clínica tem acesso. O registro garante sua segurança e continuidade de cuidado. Posso te mostrar nossa política de privacidade?'","Consultar o advogado da clínica."],c:2,k:"ethics",f:"Prontuário sem identificação é ilegal. Transparência sobre privacidade resolve o medo real sem comprometer a legalidade."},
// c:0
{q:"Como conduzir upsell de procedimento complementar de forma ética?",o:["Plantar a sugestão e passar para a médica executar: 'Muitas pacientes que fazem X avaliam Y também com a Dra.' — sem pressão e com base em avaliação clínica.","Apresentar imediatamente no momento do fechamento.","Oferecer combo com desconto.","Mencionar outras opções durante a consulta."],c:0,k:"upsell",f:"Upsell por recepcionista sem avaliação clínica pode comprometer segurança. A médica tem contexto e autoridade para recomendar com legitimidade."},
// c:3
{q:"Como responder quando paciente diz que vai pesquisar outras clínicas?",o:["Apresentar os diferenciais imediatamente.","Oferecer benefício exclusivo para ela não ir.","Perguntar o que o concorrente oferece para comparar.","'Faz todo sentido avaliar — você vai investir em algo importante. O que posso garantir é que nossa Dra. dará uma avaliação completamente honesta do que é melhor para o SEU caso — mesmo que a resposta não seja um procedimento que ela realiza.'"],c:3,k:"price",f:"Paciente que avalia concorrência precisa de segurança, não de pitch de vendas. Honestidade radical é contraintuitiva e extraordinariamente poderosa."},
// c:1
{q:"Paciente de retorno satisfeito pergunta espontaneamente se você conhece alguém que precisa de 'uma indicação'. Como aproveitar?",o:["Agradecer e pedir que ela passe o contato de amigos.","'Que gentileza! Se você sentir que alguém da sua rede se beneficiaria de uma conversa com a Dra., ficamos honrados. E qualquer pessoa que você indicar vai receber sua atenção especial desde o primeiro contato.'","Oferecer desconto para cada indicação feita.","Confirmar que aceita indicações e pedir o contato agora."],c:1,k:"referral",f:"Valorize sem transacionalizar. Cuidado com os indicados como forma de honrar a confiança dela é o melhor benefício possível."},
// c:2
{q:"Como qualificar potencial de uma lead de alto ticket pelo WhatsApp sem ser invasiva?",o:["Perguntar diretamente qual o orçamento disponível.","Verificar redes sociais antes de responder.","Fazer perguntas sobre o procedimento desejado, motivação e contexto — o perfil emerge naturalmente. Nunca perguntar sobre renda diretamente.","Pedir referência de quem indicou."],c:2,k:"discovery",f:"Qualificação sutil em alto ticket: o perfil financeiro emerge quando você entende o procedimento e as expectativas. Nunca pergunte sobre dinheiro diretamente."},
// c:0
{q:"Paciente de R$20k fecha mas pede para adiar o pagamento em 45 dias. Como manejar?",o:["Verificar a política comercial antes de qualquer promessa: 'Vou confirmar as condições de pagamento com a gestão — não quero te passar informação incorreta. Retorno ainda hoje.'","Aceitar e confirmar para não perder o fechamento.","Dizer que não é possível adiar o pagamento.","Oferecer alternativa de parcelamento no cartão."],c:0,k:"price",f:"Jamais improvise sobre condições comerciais. A paciente respeita quem verifica antes de confirmar — e a clínica evita promessas que não pode cumprir."},
// c:3
{q:"Como apresentar plano de múltiplos procedimentos sem pressionar a paciente high ticket?",o:["Apresentar todos os procedimentos de uma vez com valor total.","Começar pelo procedimento mais caro para ancorar o preço.","Criar urgência de tempo limitado para o plano completo.","Apresentar como planejamento estratégico da Dra.: 'Ela pensa a jornada estética de cada paciente de forma integrada — hoje focamos no que mais importa para você, e ao longo do tempo construímos o resto com cuidado.'"],c:3,k:"presentation",f:"Plano apresentado como jornada estratégica, não como lista de procedimentos, gera comprometimento de longo prazo sem pressão imediata."},
// c:1
{q:"Paciente high ticket menciona que a concorrente oferece 'retorno vitalício'. Como posicionar?",o:["Oferecer retorno vitalício também.","'Aqui o acompanhamento não tem nome de programa — é como a Dra. funciona com todas as pacientes. Ela acompanha o resultado ao longo do tempo porque se importa com ele, não porque está no contrato.'","Explicar que retorno vitalício é marketing sem substância.","Verificar se a clínica pode oferecer algo similar."],c:1,k:"presentation",f:"Posicione cuidado genuíno versus programa comercial. Quem faz porque se importa tem muito mais credibilidade do que quem faz porque está no contrato."},
// c:2
{q:"Como abordar paciente high ticket que chegou por anúncio pago (Instagram) e pode ter expectativas irreais?",o:["Verificar o que ela viu no anúncio antes de continuar.","Corrigir as expectativas imediatamente.","'Que ótimo que você nos encontrou! Antes de continuar, gosto de entender o que mais chamou sua atenção — para garantir que a conversa com a Dra. seja exatamente o que você precisa.'","Enviar material informativo antes da consulta."],c:2,k:"discovery",f:"Lead de anúncio pode ter expectativa formatada por comunicação de marketing. Descobrir o que ela viu e entendeu antes da consulta previne frustração e permite calibrar a conversa com a médica."},
// c:0
{q:"Paciente que veio por indicação de VIP chega sem agendar. Qual é a prioridade?",o:["Tratar com prioridade máxima: identificar quem indicou, comunicar a médica, e criar condições para atendimento ainda hoje — a indicação VIP é extensão da confiança da paciente original.","Agendar para o próximo horário disponível normalmente.","Verificar se a médica tem disponibilidade antes de qualquer promessa.","Receber normalmente como qualquer walk-in."],c:0,k:"rapport",f:"Indicação VIP carrega o peso do relacionamento original. Trate a chegada como extensão da confiança da paciente que indicou — uma oportunidade que não se desperdiça."},
// c:3
{q:"Paciente high ticket pergunta se a recepcionista já usou o procedimento que está apresentando. Como responder?",o:["Dizer que nunca fez, mas que a médica é excelente.","Dizer que sim, mesmo sem ter feito.","Mudar de assunto e falar sobre casos de pacientes.","'Pessoalmente não, mas o que posso compartilhar é o que ouço das pacientes depois — e o padrão de satisfação é muito consistente. Você quer que eu te conte o que elas mais relatam?'"],c:3,k:"presentation",f:"Honestidade sobre experiência pessoal é essencial. Transformar em relato de resultado de pacientes mantém credibilidade e entrega informação útil."},
// c:1
{q:"Paciente de R$12k fecha o procedimento e pede desconto de 'última hora' antes de assinar. Resposta?",o:["Oferecer 5% para não perder o fechamento.","'[Nome], o investimento que alinhamos reflete o cuidado completo que você vai receber. Não consigo alterar isso sem comprometer o que está incluído. O que posso verificar é se há alternativa de parcelamento que facilite para você.'","Dizer que não há nenhuma margem para desconto.","Consultar a gestão antes de responder qualquer coisa."],c:1,k:"price",f:"Desconto de última hora é teste de firmeza. Quem cede sem argumentação sinaliza que o preço original era inflado. Redirecionar para condição de pagamento preserva o valor e resolve o obstáculo real."},
// c:0
{q:"Paciente compara sua clínica com clínica de médico famoso do Instagram com 1M de seguidores. Resposta?",o:["'Seguidores são visibilidade — resultado é o que fica no espelho. A Dra. tem pacientes que escolheram sair de clínicas de médicos famosos exatamente por isso. O que você está buscando: o nome ou o resultado?'","Concordar que o médico famoso tem mais experiência visível.","Evitar a comparação e falar só dos diferenciais próprios.","Sugerir que ela consulte os dois e compare."],c:0,k:"presentation",f:"Fama no Instagram ≠ resultado cirúrgico. Reframe direto — mas não agressivo — que faz a paciente recalibrar o critério de avaliação é a resposta mais estratégica."},
// c:2
{q:"Paciente high ticket que fechou desaparece no dia do pré-operatório sem comunicar. Conduta?",o:["Ligar imediatamente para cobrar a presença.","Aguardar ela entrar em contato.","Contato empático após 30-40 minutos: '[Nome], queríamos confirmar que está tudo bem com você. Hoje era um dia importante. Estamos aqui quando precisar.' — sem cobrança, com cuidado genuíno.","Remarcar o pré-op e enviar novo convite."],c:2,k:"followup",f:"Ausência no pré-op raramente é descuido — frequentemente é recuo emocional de última hora. Contato de cuidado (não de cobrança) reabre a conversa com muito mais efetividade."},
// c:3
{q:"Paciente de alto ticket pede para ver o consultório e o bloco cirúrgico antes de decidir. Como tratar?",o:["Explicar que visitas ao bloco não são permitidas.","Agendar a visita para depois da consulta médica.","Mostrar fotos e vídeos institucionais em vez da visita.","Acolher com entusiasmo: 'Com prazer — quem pesquisa antes tende a ter expectativas bem calibradas, e a Dra. valoriza muito isso. Vou organizar um momento para você conhecer os espaços.' E coordenar com a equipe."],c:3,k:"rapport",f:"Pedido de visita é sinal de seriedade e de que a paciente está próxima da decisão. Tratar como inconveniência ou recusar sem alternativa é perder a venda. Transforme em demonstração de transparência."},
// c:0
{q:"Como responder quando paciente high ticket diz que 'precisa de mais tempo' pela quarta vez consecutiva?",o:["Explorar diretamente o que está travando a decisão: 'Quatro conversas e você continua pensando — isso me diz que algo importante ainda não foi respondido. O que, na sua percepção, ainda falta para você ter clareza?'","Dar mais tempo e aguardar ela entrar em contato.","Oferecer desconto especial para ela decidir agora.","Encerrar o processo de follow-up e aguardar ela retornar."],c:0,k:"closing",f:"Quem pede mais tempo repetidamente tem uma objeção real não revelada. A pergunta direta e gentil sobre o que falta é a única forma de desbloquear — tudo mais é adiar o inevitável."},
// c:2
{q:"Paciente pergunta se pode pagar metade agora e metade após ver o resultado. Como responder?",o:["Aceitar — é sinal de boa fé da paciente.","Dizer que o pagamento precisa ser integral antes do procedimento.","'Entendo que você quer ter segurança antes de completar o investimento. Infelizmente o pagamento precisar ser concluído antes do procedimento — é como funciona a estrutura de custos da cirurgia. O que posso verificar é a melhor forma de parcelamento para você ter essa segurança de outra forma.'","Consultar a médica antes de responder."],c:2,k:"price",f:"Pagamento condicional ao resultado é inviável operacionalmente e cria precedente problemático. A resposta honesta e empática que oferece alternativa mantém o relacionamento sem comprometer a gestão financeira."},
// c:1
{q:"Paciente de alto valor fez a consulta, recebeu o orçamento e nunca mais respondeu. Qual é a estratégia de follow-up para os primeiros 7 dias?",o:["Aguardar ela entrar em contato quando decidir.","Dia 2: mensagem personalizada com resumo do que foi conversado na consulta e pergunta aberta sobre dúvidas. Dia 5: conteúdo de valor relacionado ao procedimento dela (artigo, vídeo da Dra.). Dia 7: 'A Dra. deixou uma observação sobre seu caso que gostaria de compartilhar — seria rápido.'","Ligar no dia seguinte perguntando se ela decidiu.","Enviar o orçamento novamente no dia 3 com lembrete."],c:1,k:"followup",f:"Os primeiros 7 dias após orçamento são críticos. Cada toque deve agregar valor — nunca pressionar sobre a decisão. O ritmo certo: personalização → conteúdo → exclusividade."},
],

// ━━━━━━━━━━━━━━━━━━━ NÍVEL 3 — PREMIUM (50 q) ━━━━━━━━━━━━━━━━━━━━━━━━
3:[
// c:2
{q:"CEO de 52a, indicada por VIP, chega sem agendar e quer falar com a médica agora. Conduta?",o:["Dizer que sem agendamento não é possível.","Verificar se a médica pode atendê-la rapidamente.","Receber com máxima hospitalidade: '[Nome], que bom recebê-la — [quem indicou] falou muito bem de você. A Dra. está em consulta, mas vou verificar o primeiro momento disponível ainda hoje. Posso preparar um café enquanto você me conta o que te trouxe?'","Agendar para o próximo horário disponível."],c:2,k:"rapport",f:"Indicação VIP é gatilho máximo de reputação. Trate a chegada como privilégio para ambas as partes."},
// c:0
{q:"Paciente premium descobre que cirurgiã vai viajar 10 dias após o procedimento dela. Como tratar?",o:["Proatividade total: comunicar antecipadamente, oferecer cirurgiã substituta de confiança para emergências, canais diretos de comunicação, e contato da Dra. em viagem para urgências. Transparência antecipada resolve; descoberta tardia gera crise.","Explicar que a equipe fica disponível.","Remarcar o procedimento para depois da viagem.","Pedir que a paciente decida se quer continuar com o plano."],c:0,k:"ethics",f:"Cliente premium tem tolerância zero para surpresas que afetem cuidado. Informe ANTES, ofereça soluções concretas, demonstre que a continuidade do cuidado foi planejada."},
// c:3
{q:"Paciente VIP pede exclusividade de agenda — nenhuma outra paciente no mesmo horário na clínica. Resposta?",o:["Dizer que é impossível operacionalmente.","Dizer que há horários mais tranquilos disponíveis.","Garantir a exclusividade sem verificar viabilidade.","'Valorizamos muito sua privacidade e conforto. Temos horários com muito menor movimento que posso priorizar. Quer que eu verifique os mais exclusivos da semana?' — e avaliar com a gestão se exclusividade total tem custo diferenciado."],c:3,k:"rapport",f:"Pedido 'impossível' tem resposta possível: máxima proximidade da demanda. Exclusividade total pode ter custo — que alguns clientes premium pagam com prazer."},
// c:1
{q:"Paciente de 60a busca procedimento que a Dra. avaliaria como inadequado à saúde dela. Como a recepcionista deve proceder?",o:["Dizer que a médica provavelmente vai recusar o procedimento.","Agendar a consulta com prioridade e informar à médica o contexto antes do atendimento. Nunca negar procedimento antes da avaliação médica.","Verificar antes se a paciente tem as condições de saúde necessárias.","Mencionar sutilmente que esse procedimento nem sempre é indicado para a faixa etária."],c:1,k:"ethics",f:"Recusa de procedimento por indicação clínica é papel exclusivo da médica — com base em anamnese completa. Recepcionista que antecipa 'não vai poder fazer' está extrapolando sua função."},
// c:2
{q:"Paciente premium insatisfeita com resultado de 8 meses está emocionalmente alterada. Primeira ação?",o:["Chamar a médica imediatamente.","Pedir que ela descreva a insatisfação por escrito.","Oferecer espaço privado, escutar completamente sem interrupção, não defender a clínica, não fazer promessas: 'Vou garantir que a Dra. se reúna com você o mais rápido possível. Você merece uma conversa direta com ela.'","Verificar o prontuário antes de qualquer resposta."],c:2,k:"rapport",f:"Paciente emocionalmente alterada precisa de escuta antes de solução. Defender a clínica antes de escutar é o caminho mais rápido para o Reclame Aqui."},
// c:0
{q:"Paciente pergunta: 'Quantas cirurgias desse tipo a Dra. já fez?' e você não sabe. O que fazer?",o:["'Não quero te dar número impreciso sobre algo tão importante. Posso verificar esse dado para te confirmar com exatidão — ou você pode perguntar à Dra. na consulta, que vai te dar muito mais contexto do que um número isolado.'","Dar uma estimativa: 'Centenas, com certeza.'","Dizer que são muitas e que ela tem ampla experiência.","Verificar no site da clínica."],c:0,k:"ethics",f:"Inventar estatística de experiência cirúrgica é antiético e potencialmente ilegal. Transparência honesta cria muito mais credibilidade."},
// c:3
{q:"Como apresentar clínica pequena para paciente acostumada a grandes hospitais renomados?",o:["Focar no número de cirurgias realizadas e prêmios.","Comparar indiretamente com custos de grandes hospitais.","Mostrar before/afters impressionantes.","Posicionar pelo que grandes estruturas não entregam: atenção exclusiva, a mesma cirurgiã do início ao fim, ambiente íntimo, acompanhamento personalizado. Premium não é tamanho — é qualidade de atenção."],c:3,k:"presentation",f:"Pequeno é diferencial quando enquadrado como vantagem. Intimidade e exclusividade são valores que grandes estruturas estruturalmente não conseguem entregar."},
// c:1
{q:"Paciente que está em análise de divórcio quer operar 'o mais rápido possível antes de o patrimônio ser bloqueado'. Como agir?",o:["Agendar com urgência conforme solicitado.","Receber sem julgamento, mas alertar internamente à médica que há contexto emocional e jurídico relevante. A Dra. deve avaliar se a paciente está em condições emocionais adequadas para consentimento livre e informado.","Dizer que urgência financeira não é critério para priorizar agenda.","Consultar o advogado da clínica antes de prosseguir."],c:1,k:"ethics",f:"Urgência motivada por situação jurídica ou emocional aguda é sinal de alerta para consentimento informado. A médica precisa dessa informação antes da consulta."},
// c:2
{q:"Paciente premium diz: 'Não me importo com o preço, só quero o melhor.' Como responder?",o:["Apresentar o pacote mais caro disponível.","Confirmar que a clínica entrega o melhor do mercado.","'Adoramos essa visão. O melhor para cada caso é o que a Dra. indica baseada na sua avaliação individual — não necessariamente o mais complexo ou caro, mas o mais preciso para o que você busca.'","Apresentar a cirurgiã como a melhor da especialidade."],c:2,k:"presentation",f:"'Não me importo com preço' não é cheque em branco — é sinal de prioridade de resultado. Use isso para posicionar precisão, não para vender o mais caro."},
// c:0
{q:"Paciente de cirurgia de revisão tem autoestima muito abalada. Abordagem?",o:["Escuta ampla sem promessas: '[Nome], sinto muito que você passou por isso. Você merecia outro resultado. O que podemos oferecer é uma avaliação honesta da Dra. sobre o que é possível agora.' — sem prometer 'vai ficar ótima'.","Tranquilizar dizendo que vai ficar perfeita.","Mostrar cases de revisão bem-sucedidos.","Pedir que ela traga fotos do resultado que esperava."],c:0,k:"rapport",f:"Autoestima abalada pós-procedimento ruim é trauma real. Promessa de resultado perfeito antes de avaliação é irresponsável."},
// c:3
{q:"Paciente VIP que gasta R$50k/ano reclama do atendimento de uma funcionária. Como agir?",o:["Ouvir e dizer que vai verificar.","Chamar a funcionária para se desculpar diante da paciente.","Verificar com a funcionária o que aconteceu antes de responder.","Ouvir com total atenção, não defender nem contradizer: 'Você tem toda razão em esperar mais. Vou garantir pessoalmente que sua próxima experiência seja diferente.' — tratar internamente sem expor a funcionária."],c:3,k:"rapport",f:"Reclamação de VIP é oportunidade de blindagem do relacionamento. Nunca exponha colaborador diante da paciente. Os bastidores ficam nos bastidores."},
// c:1
{q:"Como conduzir paciente premium que quer procedimento 'para se sentir bem' sem detalhar mais?",o:["Perguntar diretamente que procedimento ela quer.","'Adorei que você colocou assim. Se você pudesse mudar uma coisa hoje, qual seria? Me conta sem filtro.' — e escutar profundamente antes de qualquer menção a procedimentos.","Apresentar os procedimentos mais populares.","Encaminhar direto para a médica."],c:1,k:"discovery",f:"'Quero me sentir bem' é convite para descoberta profunda de motivação real. Quem vai direto ao procedimento perde a informação mais valiosa."},
// c:2
{q:"Paciente pede para a Dra. fazer exatamente o que o marido pediu. Como a recepcionista deve sinalizar esse contexto?",o:["Registrar o pedido e repassar para a médica sem contexto.","Mencionar sutilmente que a decisão deve ser dela.","Coletar a informação sem julgamento e sinalizar internamente à médica antes da consulta: 'Paciente mencionou que o procedimento é solicitação do marido — só para contexto na avaliação de autonomia e motivação.'","Ignorar, pois a motivação não é papel da recepcionista avaliar."],c:2,k:"ethics",f:"Motivação externa é flag de consentimento informado para a médica avaliar. A recepcionista coleta e repassa — a médica avalia a autonomia na consulta."},
// c:0
{q:"Qual é o erro mais comum na abordagem de clientes premium que destrói o relacionamento?",o:["Tratar o cliente premium como se ele precisasse de explicações básicas ou processos padronizados que desconsideram sua sofisticação. O premium quer ser reconhecido como alguém que já sabe — e quer personalização, não protocolo padrão.","Cobrar mais do que o combinado.","Não oferecer opções de pagamento premium.","Fazer esperar mais de 5 minutos."],c:0,k:"rapport",f:"Condescendência — mesmo bem-intencionada — é o maior destruidor de relacionamentos premium. Assuma sofisticação e surpreenda pela profundidade, não pela explicação básica."},
// c:3
{q:"Paciente premium menciona avaliar ir à Colômbia por 60% menos. Como responder?",o:["Explicar os riscos do turismo médico com ênfase nos perigos.","Mostrar custos ocultos do turismo médico.","Dizer que qualidade no Brasil é superior à da Colômbia.","'Entendo a lógica financeira e respeito que você pesquisa bem. Posso compartilhar o que pacientes que passaram por isso nos contam quando retornam? Não para te dissuadir, mas para uma comparação consciente do suporte pós-operatório.'"],c:3,k:"price",f:"Alarmismo ressoa como interesse próprio e perde credibilidade. Relatos reais de pacientes deixam a própria paciente calcular o risco."},
// c:1
{q:"Como apresentar o plano pós-operatório de forma que eleve o valor percebido do procedimento?",o:["Detalhar o protocolo de medicações e curativos.","'O pós-operatório aqui é tão estruturado quanto o procedimento — a Dra. acompanha pessoalmente, temos protocolo específico para maximizar seu resultado. Esse cuidado continuado é o que faz a diferença entre resultado bom e excepcional.'","Listar os procedimentos de follow-up incluídos.","Mencionar que a recuperação é acompanhada pela enfermagem."],c:1,k:"presentation",f:"Pós-operatório como diferencial de resultado — não lista de procedimentos — é enquadramento premium."},
// c:2
{q:"Paciente premium solicita sigilo absoluto de que está na clínica (figura pública). Como operacionalizar?",o:["Garantir verbalmente que o sigilo será mantido.","Dizer que a clínica já tem sigilo médico por lei.","Protocolo específico: nome não anunciado, horário de menor movimento, entrada/saída discreta se possível, equipe avisada, prontuário com acesso restrito. Sigilo médico é piso, não teto.","Verificar o que a política da clínica permite nesse caso."],c:2,k:"ethics",f:"Sigilo médico é lei. Sigilo operacional premium é escolha de excelência. Para figuras públicas, o segundo vai muito além do primeiro."},
// c:0
{q:"Paciente premium insatisfeita ameaça 'colocar no Reclame Aqui'. Como desescalonar?",o:["Total escuta, zero defensividade: '[Nome], lamento muito que sua experiência não correspondeu ao que você merecia. Posso garantir que a Dra. fale pessoalmente com você ainda hoje? Quero entender o que aconteceu — não para evitar uma publicação, mas porque você merece uma resposta à altura.'","Pedir que ela espere a conversa com a médica antes de publicar.","Explicar os canais de resolução disponíveis.","Dizer que reclamação pública não vai mudar o resultado."],c:0,k:"rapport",f:"'Não para evitar uma publicação' desmonta a ameaça. Mostra que o interesse é genuíno. Paciente que sente isso raramente publica."},
// c:3
{q:"Paciente extremamente exigente reclama de tudo desde a decoração até o café. Abordagem?",o:["Explicar que a clínica tem padrão alto.","Verificar quais das reclamações são procedentes.","Pedir que ela formalize as sugestões por escrito.","Escuta ativa sem defensividade, anotar cada ponto, e depois: 'Obrigada por ser tão franca — é assim que melhoramos. O que é mais importante para você na experiência aqui?' — identifique a dor real."],c:3,k:"rapport",f:"Exigência generalizada muitas vezes mascara ansiedade real sobre o procedimento. Escute tudo, depois busque a preocupação central."},
// c:1
{q:"Qual é a diferença entre 'paciente satisfeita' e 'paciente fidelizada' em clínica premium?",o:["Paciente satisfeita pagou e gostou; fidelizada voltou mais de uma vez.","Satisfeita não reclama. Fidelizada recomenda, retorna proativamente, perdoa falhas ocasionais porque a confiança construída é maior que o erro pontual, e não cotiza concorrentes.","Paciente fidelizada tem contrato de manutenção.","Fidelizada recebe desconto progressivo."],c:1,k:"ltv",f:"Satisfação é ausência de reclamação. Fidelização é advocacy ativo. O caminho entre elas está na qualidade da experiência emocional em cada ponto de contato."},
// c:2
{q:"Paciente premium pergunta: 'Por que pagar mais aqui do que em lugares igualmente bons?' Resposta honesta?",o:["Porque nossa qualidade é superior a qualquer concorrente.","Explicar os custos operacionais da clínica premium.","'É uma pergunta justa. O que mais diferencia não é o procedimento em si — é o que envolve: a atenção antes, o acompanhamento depois, a disponibilidade da Dra., e a experiência de sentir que aqui você importa de forma individual. Posso te mostrar como é esse processo?'","Mostrar prêmios e certificações."],c:2,k:"price",f:"Honestidade sobre o que diferencia é mais poderosa que superioridade declarada. Quem diz 'o que fazemos diferente é isso' ganha respeito."},
// c:0
{q:"Paciente de cirurgia reparadora chega com baixíssima autoestima após resultado ruim de outro médico. Como receber?",o:["Acolhimento sem promessas, espaço privado desde o primeiro momento, escuta sem julgamento: 'Sinto muito que você passou por isso. Você merecia um resultado diferente. Aqui queremos entender o que é possível e o melhor caminho para você.'","Tranquilizar dizendo que vai ficar perfeita com certeza.","Mostrar antes e depois de casos de revisão bem-sucedidos.","Pedir que ela descreva o resultado que esperava originalmente."],c:0,k:"rapport",f:"Trauma pós-procedimento ruim exige acolhimento prioritário. Promessa de resultado perfeito antes de avaliação é antiética e agrava a vulnerabilidade."},
// c:3
{q:"Paciente extremamente exigente questiona cada detalhe do protocolo. Como posicionar?",o:["Responder a cada questionamento com paciência.","Pedir que ela escreva suas dúvidas para a consulta com a médica.","Criar material explicativo sobre o protocolo.","Transformar o rigor dela em ativo: 'Que bom que você pesquisa tanto — a Dra. adora pacientes informadas. Significa que você vai aproveitar ao máximo o que ela vai explicar. Já anotou suas principais dúvidas?'"],c:3,k:"rapport",f:"Exigência como ativo transforma resistência em engajamento. Paciente que pesquisa muito tende a ser defensora ferrenha quando satisfeita."},
// c:1
{q:"Paciente premium quer fazer procedimento 'antes de o marido descobrir'. Como agir?",o:["Agendar normalmente, a decisão é dela.","Sem julgamento, acolher, mas sinalizar internamente à médica que há contexto relacional relevante para a avaliação de autonomia e consentimento informado. A Dra. saberá como abordar na consulta.","Perguntar o motivo do sigilo em relação ao marido.","Garantir sigilo total e agendar."],c:1,k:"ethics",f:"Segredo em relação ao parceiro não é julgamento da recepcionista fazer. Mas é contexto que a médica precisa para avaliar autonomia e dinâmica relacional — sinalizar internamente é cuidado."},
// c:2
{q:"Como tratar paciente premium que cancela pela segunda vez sem avisar?",o:["Cobrar taxa de no-show na segunda ocorrência.","Ligar imediatamente para saber o motivo.","Contato acolhedor: '[Nome], sentimos sua falta novamente. Queremos garantir que tudo está bem com você. Quando sentir que é o momento certo, estamos aqui.'","Encaminhar um protocolo formal de cancelamento."],c:2,k:"rapport",f:"Dois no-shows podem indicar ambivalência, medo ou circunstância de vida. Contato de cuidado genuíno — não de cobrança — é o que reabre o canal."},
// c:0
{q:"Paciente VIP pergunta se a Dra. opera pacientes de plano de saúde. Qual é a sensibilidade nessa pergunta?",o:["Ela está avaliando se a Dra. divide atenção entre diferentes perfis de pacientes. Responda com o que diferencia a atenção que ela receberá — sem depreciar quem tem plano.","Responder diretamente se sim ou não.","Dizer que não é relevante para o atendimento dela.","Explicar que a clínica é exclusivamente particular."],c:0,k:"presentation",f:"'A Dra. opera plano?' é pergunta de exclusividade, não de curiosidade logística. O que a paciente VIP quer saber é se ela vai ter atenção diferenciada — responda a isso, não à pergunta literal."},
// c:3
{q:"Paciente premium descobre que sua consulta foi encurtada porque a Dra. atrasou o atendimento anterior. Como agir?",o:["Explicar que foi uma situação excepcional.","Pedir que ela reagende para uma consulta completa.","Perguntar se ela quer continuar ou reagendar.","Ser totalmente transparente e proativa: 'Lamento que o tempo de hoje ficou menor do que você merecia. A Dra. vai completar o alinhamento com você antes de qualquer decisão. Posso já deixar esse próximo momento agendado?'"],c:3,k:"rapport",f:"Cliente premium percebe quando está sendo encurtada. Transparência e solução imediata são únicas saídas que preservam o relacionamento."},
// c:1
{q:"Paciente de ticket máximo pergunta sobre novo procedimento que a clínica não tem. Como manejar?",o:["Dizer que não trabalham com esse procedimento.","'Que bom que você está sempre atualizada! Posso verificar com a Dra. qual é a posição técnica dela sobre esse procedimento — ela acompanha as inovações de perto. Retorno ainda hoje com a opinião dela.'","Recomendar uma clínica que realize o procedimento.","Dizer que o procedimento ainda não tem evidências suficientes."],c:1,k:"rapport",f:"Nunca admita lacuna sem criar pontes. Transforme em oportunidade de demonstrar que a médica está atualizada e que a relação vai além do catálogo atual."},
// c:2
{q:"Paciente VIP fez procedimento há 1 ano e nunca mais retornou. Estratégia de reativação?",o:["Enviar mensagem de promoção exclusiva para pacientes VIP.","Ligar diretamente perguntando se quer fazer algum procedimento novo.","Contato personalizado e genuíno: 'A Dra. revisou seu prontuário e fez uma observação sobre sua evolução que gostaria de compartilhar. Seria um prazer um café rápido? Sem procedimento em mente — só para colocarem o papo em dia.'","Enviar conteúdo educativo sobre novos procedimentos."],c:2,k:"reactivation",f:"Reativação efetiva começa pelo relacionamento, não pela venda. 'A Dra. pensou em você' é o gatilho mais poderoso quando genuíno."},
// c:0
{q:"Como qualificar se paciente premium é financeiramente adequada sem perguntar sobre renda?",o:["Pelo procedimento desejado, pelo contexto de vida que ela compartilha, pelas referências que faz (viagens, lifestyle), e pelo nível de detalhe com que faz perguntas. Perfil financeiro premium emerge naturalmente na conversa.","Pesquisar o LinkedIn da paciente antes da consulta.","Perguntar indiretamente: 'Você já tem o investimento planejado?'","Verificar o histórico de procedimentos que ela menciona ter feito."],c:0,k:"discovery",f:"Qualificação de perfil premium é leitura de sinais durante a conversa — nunca pergunta direta sobre renda. O contexto de vida que ela compartilha diz tudo."},
// c:3
{q:"Paciente premium muito falante domina a conversa e não dá espaço para informações importantes. Técnica?",o:["Deixar ela falar até terminar completamente.","Interrompê-la educadamente para fazer perguntas estratégicas.","Tomar notas enquanto ela fala para responder depois.","Escutar com presença total, e nos momentos de respiração usar pergunta direcionada: 'Isso é muito importante. Antes de continuar, quero garantir que entendi bem — quando você fala de X, está buscando Y?'"],c:3,k:"discovery",f:"Paciente falante revela muito sobre motivação e expectativa. Usar as pausas naturais com perguntas direcionadas redireciona sem interromper e coleta as informações necessárias."},
// c:1
{q:"Paciente premium pede desconto 'por ser cliente antiga'. Abordagem?",o:["Oferecer desconto de 10% por fidelidade.","'[Nome], sua fidelidade é algo que valorizamos profundamente — e expressamos isso de formas que vão além do desconto: prioridade de agenda, atenção personalizada, acompanhamento próximo. O investimento reflete o cuidado que você merece. Posso verificar a melhor condição de pagamento para você?'","Dizer que a clínica não pratica descontos por fidelidade.","Verificar com a gestão o desconto máximo possível."],c:1,k:"price",f:"Fidelidade se honra com experiência, não com desconto. Quem desconta desvaloriza o serviço e cria expectativa de desconto em todos os futuros procedimentos."},
// c:2
{q:"Como conduzir paciente premium que faz muitas pesquisas online e chega com informações contraditórias?",o:["Corrigir as informações erradas diretamente.","Dizer que o Google não é fonte confiável para medicina.","'Você chegou muito bem preparada! A Dra. vai adorar essa conversa — ela tem prazer em esclarecer o que é real para o SEU caso. Posso já anotar as principais dúvidas que você quer abordar com ela?'","Enviar material confiável antes da consulta para ela substituir o que pesquisou."],c:2,k:"rapport",f:"Paciente bem pesquisada, mesmo com informações mistas, é parceira valiosa da consulta. Valide o esforço e use as dúvidas dela para estruturar uma consulta mais rica."},
// c:0
{q:"Paciente premium chega muito atrasada e quer ser atendida mesmo assim. Como manejar?",o:["Verificar com a médica se é possível atender mesmo com o atraso e, se sim, acolher sem julgamento. Se não for possível, oferecer reagendamento prioritário com pedido de desculpas genuíno pela impossibilidade.","Informar que o horário foi perdido e agendar para a próxima disponibilidade.","Atender normalmente sem mencionar o atraso.","Cobrar taxa de no-show parcial pelo atraso."],c:0,k:"rapport",f:"Paciente premium atrasada espera flexibilidade — mas a clínica tem responsabilidade com as demais. A solução equilibrada é verificar viabilidade e oferecer reagendamento prioritário com acolhimento genuíno."},
// c:3
{q:"Paciente pede opinião sobre procedimento que ela planeja fazer em outra clínica. Como responder?",o:["Dar a opinião da recepcionista sobre o procedimento.","Dizer que não pode opinar sobre o trabalho de outros.","Sugerir que ela faça o procedimento na própria clínica.","'Essa é uma pergunta para a Dra. — ela tem posição técnica sobre o procedimento em si. Posso verificar se ela consegue um momento para essa conversa? Às vezes uma segunda opinião de uma especialista é o que faz toda diferença na decisão.'"],c:3,k:"ethics",f:"Opinião técnica sobre procedimento é papel da médica, não da recepcionista. Mas facilitar acesso à segunda opinião é gesto de cuidado que pode trazer a paciente para dentro da clínica."},
// c:1
{q:"Paciente premium fala que 'outra clínica tratou ela muito melhor'. Como responder?",o:["Defender o atendimento da própria clínica.","'Isso é muito importante de saber — obrigada por ser franca. O que especificamente foi diferente lá? Quero garantir que aqui você tenha a experiência que você merece.'","Perguntar por que ela voltou se a outra clínica foi melhor.","Explicar que cada clínica tem seu estilo de atendimento."],c:1,k:"rapport",f:"Crítica comparativa é ouro — revela exatamente o que a paciente valoriza. Quem acolhe a comparação sem se defender e descobre o que importa para ela tem a informação para superar."},
// c:2
{q:"Como posicionar a consulta para paciente premium que 'já sabe tudo' sobre o procedimento?",o:["Confirmar que ela sabe e pular as explicações básicas.","Perguntar o que ela já sabe para complementar.","'Que bom que você chegou tão preparada! A consulta com a Dra. vai ser muito mais rica então — ela vai partir do que você já sabe para o que é específico do SEU caso, não uma explicação genérica. É exatamente esse nível de conversa que ela prefere.'","Fazer perguntas para verificar o que ela realmente sabe."],c:2,k:"presentation",f:"Paciente que 'já sabe tudo' quer ser tratada como par da médica. Posicione a consulta como conversa de nível avançado, personalizada ao caso dela."},
// c:0
{q:"Paciente VIP pede que a Dra. use materiais de uma marca específica que ela pesquisou. Abordagem?",o:["Anotar a preferência e comunicar à médica antes da consulta, para que ela possa avaliar a indicação técnica e discutir com a paciente na consulta — sem prometer que vai usar nem recusar antes de avaliação.","Confirmar que a clínica usa essa marca.","Dizer que a médica escolhe os materiais baseada em sua experiência.","Pesquisar a marca antes de responder."],c:0,k:"ethics",f:"Preferência de material é dado clínico relevante para a médica avaliar. A recepcionista anota e comunica — sem prometer nem recusar. A decisão pertence à médica com base em avaliação técnica."},
// c:3
{q:"Paciente premium que veio por indicação expressa insatisfação logo na primeira visita. Como agir?",o:["Verificar o que causou a insatisfação antes de agir.","Defender a clínica e explicar que a indicadora ficou satisfeita.","Pedir que ela espere a consulta para ter uma impressão mais completa.","Agir imediatamente com escuta total e solução: '[Nome], lamento muito. Me conta o que aconteceu — quero garantir que isso seja resolvido agora e que sua experiência aqui seja o que você merece.'"],c:3,k:"rapport",f:"Insatisfação no primeiro contato de paciente que veio por indicação VIP é emergência de relacionamento. Escuta imediata e ação concreta são a única resposta aceitável."},
// c:1
{q:"Paciente premium de 65a quer procedimento antiaging extenso. A médica provavelmente vai recomendar etapas. Abordagem?",o:["Confirmar o procedimento extenso e deixar a médica planejar.","Acolher com entusiasmo e agendar a consulta, sem antecipar que a médica vai recomendar etapas — essa é uma conversa clínica, não da recepcionista.","Mencionar que resultados extensos geralmente precisam de etapas.","Verificar a idade e o histórico de saúde antes de agendar."],c:1,k:"ethics",f:"Planejamento cirúrgico é papel da médica na consulta. A recepcionista agenda e cria o contexto para a conversa certa acontecer — sem antecipar restrições ou planos."},
// c:2
{q:"Paciente quer procedimento que está 'em alta no Instagram' mas a médica não pratica. Como responder?",o:["Dizer que a clínica não oferece esse procedimento.","Recomendar clínica concorrente que o faça.","'Que bom que você pesquisa! Posso verificar com a Dra. qual é a posição técnica dela sobre esse procedimento — às vezes há alternativas que chegam ao mesmo resultado por um caminho que ela considera mais seguro. Retorno ainda hoje.'","Dizer que procedimentos virais nem sempre são comprovados."],c:2,k:"rapport",f:"Procedimento que a clínica não oferece pode ter alternativa equivalente. Verificar com a médica antes de negar demonstra que o interesse é o resultado da paciente, não o catálogo da clínica."},
// c:0
{q:"Paciente de alto valor quer procedimento durante o período que a equipe estará reduzida (férias de verão). Como manejar?",o:["Ser transparente sobre a redução de equipe e oferecer duas opções: antecipar o procedimento ou agendar após o retorno completo da equipe, explicando o que cada opção implica para o cuidado pós-operatório.","Agendar normalmente, a equipe reduzida resolve.","Dizer que os procedimentos estão suspensos no período.","Deixar a paciente decidir sem dar informações sobre a equipe."],c:0,k:"ethics",f:"Transparência sobre condições de atendimento é cuidado, não fraqueza. Paciente premium que descobre redução de equipe após o procedimento gera crise. Informe antes e deixe a decisão com ela."},
// c:3
{q:"Paciente premium chega referenciando um procedimento pelo nome errado (confundiu dois procedimentos distintos). Abordagem?",o:["Corrigir imediatamente e explicar a diferença.","Continuar a conversa sem corrigir para não constranger.","Perguntar para a médica antes de qualquer comentário.","Corrigir com gentileza e curiosidade: 'Só para garantir que estamos falando do mesmo procedimento — você está pensando em X ou em Y? Os dois têm efeitos bem diferentes e quero ter certeza de que a Dra. saiba exatamente o que você busca.'"],c:3,k:"discovery",f:"Correção com curiosidade genuína evita constrangimento e coleta informação precisa. A confusão revela que ela está pesquisando — o que é positivo."},
// c:1
{q:"Paciente premium descobre que uma amiga sua também é paciente da mesma clínica. Ela parece desconfortável. Como agir?",o:["Confirmar ou negar se a amiga é paciente.","'[Nome], quero garantir que você saiba: o sigilo médico aqui é absoluto. Nenhuma informação sobre nenhum paciente é compartilhada — nem confirmamos se alguém é ou não paciente da clínica. Sua privacidade é intocável.' — sem confirmar nem negar sobre a amiga.","Dizer que tem muitas pacientes e não cruza informações.","Mudar de assunto discretamente."],c:1,k:"ethics",f:"Confirmar ou negar que outra pessoa é paciente viola o sigilo médico. A resposta correta reafirma a proteção da privacidade DELA — sem mencionar a amiga."},
// c:2
{q:"Como apresentar honorários mais altos da Dra. em relação a concorrentes do mesmo nível técnico?",o:["Comparar diretamente os anos de experiência.","Justificar com custos operacionais da clínica.","'O honorário da Dra. reflete não só a técnica mas a experiência completa: o tempo que ela dedica a cada caso antes, durante e depois. Pacientes que passaram por outras clínicas e chegaram aqui costumam dizer que o que diferencia não é o procedimento em si — é o que vem junto com ele.'","Dizer que ela é a melhor da especialidade na região."],c:2,k:"price",f:"Honorário premium se justifica por experiência completa, não por declaração de superioridade. Relatos de pacientes que fizeram a comparação são o argumento mais poderoso."},
// c:0
{q:"Paciente de nível premium pergunta se a Dra. vai pessoalmente ao bloco ou se delega para residente/assistente. Resposta?",o:["'A Dra. conduz todos os seus procedimentos pessoalmente — do início ao fim. Não há delegação de etapas cirúrgicas. É um dos pilares do compromisso dela com cada paciente.'","Dizer que depende da complexidade do caso.","Dizer que há equipe de apoio cirúrgico qualificado.","Verificar com a médica antes de responder."],c:0,k:"presentation",f:"Presença pessoal da médica em todos os procedimentos é diferencial premium inequívoco. Se for a realidade da clínica, afirme com clareza e confiança — é exatamente o que a paciente quer ouvir."},
// c:1
{q:"Paciente premium descobre que sua médica foi mencionada negativamente em matéria jornalística. Como a recepcionista deve agir?",o:["Ignorar — a médica que deve responder.","Comunicar imediatamente à médica e à gestão. Se a paciente trouxer o assunto, escutar sem defensividade: 'Entendo que isso gerou preocupação. A Dra. é quem melhor pode esclarecer o contexto — posso garantir esse contato com ela diretamente?'","Defender a médica explicando que a matéria é tendenciosa.","Enviar nota de esclarecimento da clínica para a paciente."],c:1,k:"ethics",f:"Crise de reputação exige escalação imediata e escuta ativa. Defender sem informação completa ou minimizar a preocupação da paciente são erros que ampliam a crise."},
// c:3
{q:"Paciente premium pergunta se a clínica tem câmeras no consultório. Como responder?",o:["Dizer que sim, para segurança de todos.","Dizer que não — consultas são privadas.","Explicar que depende do ambiente (recepção sim, consultório não).","Responder com transparência completa sobre quais espaços têm câmera, por qual motivo, e confirmar que consultório e sala de procedimento são espaços de total privacidade. Sem defensividade."],c:3,k:"ethics",f:"Pergunta sobre câmeras é sobre privacidade e confiança. Resposta transparente e completa — sem se defender — reforça que a clínica não tem nada a esconder."},
// c:0
{q:"Paciente de ticket máximo pede que a médica a atenda fora do horário comercial em sua residência. Abordagem?",o:["Comunicar à médica e verificar viabilidade antes de qualquer resposta. Se não for possível, oferecer alternativa real: 'A Dra. não realiza atendimentos residenciais, mas posso garantir um horário exclusivo e fora do movimento padrão na clínica — de forma que o ambiente seja o mais privado e confortável possível para você.'","Dizer que atendimentos residenciais não são oferecidos.","Consultar a médica e aceitar se ela concordar.","Dizer que isso só é possível mediante taxa adicional."],c:0,k:"rapport",f:"Pedido impossível tem resposta possível: máxima aproximação da demanda dentro do viável. Comunicar à médica antes de responder é essencial — a decisão é dela, não da recepcionista."},
// c:2
{q:"Paciente premium que fez procedimento de R$45k retorna insatisfeita 4 meses depois dizendo que 'não gostou do resultado'. Abordagem?",o:["Defender o trabalho da médica com base nos before/afters.","Verificar o prontuário antes de qualquer resposta.","Escuta total sem defensividade, espaço privado imediato, coleta cuidadosa do que especificamente a incomoda, e escalação urgente para a médica: 'Você merece conversar diretamente com a Dra. sobre isso — vou garantir esse encontro com prioridade.'","Perguntar se ela seguiu todos os cuidados pós-operatórios."],c:2,k:"rapport",f:"Insatisfação 4 meses pós-procedimento de alto valor é situação crítica. Qualquer defensividade — mesmo implícita (perguntar sobre cuidados pós-op) — é percebida como culpabilização da paciente. Escuta total e escalação imediata são os únicos movimentos corretos."},
],

// ━━━━━━━━━━━━━━━━━━━ NÍVEL 4 — LTV MASTER (50 q) ━━━━━━━━━━━━━━━━━━━━━
4:[
// c:2
{q:"Paciente VIP fez 5 procedimentos em 3 anos e sumiu há 8 meses. Estratégia de reativação?",o:["Enviar mensagem perguntando se quer procedimento novo.","Enviar promoção exclusiva para paciente VIP.","'[Nome], a Dra. revisou seu prontuário e fez uma observação sobre sua evolução que gostaria de compartilhar. Seria um prazer um café rápido? Sem procedimento em mente — só para colocarem o papo em dia.'","Ligar com novidade de procedimento que pode interessar."],c:2,k:"reactivation",f:"Reativação efetiva não começa pela venda — começa pelo relacionamento. 'A Dra. pensou em você' é o gatilho mais poderoso quando genuíno."},
// c:0
{q:"Como calcular o LTV potencial de uma paciente e usar isso estrategicamente?",o:["LTV real = procedimentos diretos + valor das indicações geradas + valor de marca (depoimentos, conteúdo) + blindagem competitiva (paciente que não cotiza concorrente). Uma paciente de R$10k/ano que indica 3 pessoas ao ano tem LTV real de R$30k+.","Multiplicar o ticket médio pelo número de procedimentos que ela quer fazer.","Calcular quantas consultas ela fez nos últimos 12 meses.","LTV é ticket médio vezes frequência de retorno."],c:0,k:"ltv",f:"LTV em estética é muito maior do que parece quando você inclui indicações. Investimento em excelência de experiência tem ROI concreto."},
// c:3
{q:"Paciente VIP pergunta espontaneamente se você conhece alguém que precisa de 'uma indicação'. Como aproveitar?",o:["Agradecer e pedir que ela passe o contato de amigos.","Oferecer desconto para cada indicação feita.","Confirmar que aceita indicações e pedir o contato agora.","'[Nome], que gentileza! Se você sentir que alguém da sua rede se beneficiaria de uma conversa com a Dra., ficamos honrados. E qualquer pessoa que você indicar vai receber sua atenção especial desde o primeiro contato.'"],c:3,k:"referral",f:"Valorize sem transacionalizar. O cuidado com os indicados como forma de honrar a confiança dela é o melhor benefício possível."},
// c:1
{q:"Como construir carteira de pacientes VIP que gera previsibilidade de receita?",o:["Manter planilha de procedimentos que cada paciente quer fazer.","Sistema ativo de gestão de relacionamento: cronograma de contatos por tipo de paciente, calendário de reavaliações periódicas, registro de momentos de vida, e proposta de manutenção regular. Previsibilidade vem de relacionamento ativo, não de esperar a paciente ligar.","Oferecer planos mensais de procedimentos estéticos.","Criar grupo de WhatsApp VIP com novidades e promoções."],c:1,k:"ltv",f:"Carteira VIP é ativo de negócio, não lista de contatos. CRM ativo e proposta de manutenção transformam receita esporádica em previsível."},
// c:2
